<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Moto Dashboard</title>
  <meta name="description" content="Moottoripyörän digitaalinen mittaristo">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MotoDash">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --panel-bg: rgba(0, 0, 0, 0.72);
      --panel-border: rgba(255,255,255,0.10);
      --accent: #ffcc00;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      color: #fff;
      touch-action: none;
    }

    /* ── MAP ── */
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: pan-x pan-y pinch-zoom;
      z-index: 1;
    }

    /* ── HUD OVERLAY ── */
    #hud {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      padding:
        calc(var(--safe-top) + 6px)
        calc(var(--safe-right) + 8px)
        calc(var(--safe-bottom) + 6px)
        calc(var(--safe-left) + 8px);
      gap: 4px;
    }

    /* ── TOP PANEL ── */
    #top-panel {
      pointer-events: auto;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
    }

    /* Speed block */
    #speed-block {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 4px 16px 4px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 130px;
    }

    #speed-value {
      font-size: clamp(56px, 12vw, 110px);
      font-weight: 900;
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(255,204,0,0.5), 0 2px 4px rgba(0,0,0,0.8);
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }

    #speed-unit {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: -4px;
    }

    /* Info panel */
    #info-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    #time-display {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .info-row {
      font-size: clamp(11px, 2vw, 15px);
      font-weight: 600;
      color: rgba(255,255,255,0.90);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      white-space: nowrap;
      line-height: 1.25;
    }

    #weather-row { color: #87ceeb; }
    #wind-row { color: rgba(255,255,255,0.80); }
    #gps-status-row { }
    #gps-accuracy-row { color: rgba(255,255,255,0.75); }
    #network-row { }

    .status-good { color: #66ff88; }
    .status-moderate { color: var(--accent); }
    .status-bad { color: #ff6666; }

    /* Control buttons in HUD */
    #controls-row {
      pointer-events: auto;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .hud-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .hud-btn:active { background: rgba(255,255,255,0.2); }

    /* Safety message */
    #safety-msg {
      pointer-events: none;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: clamp(9px, 1.5vw, 11px);
      color: rgba(255,255,255,0.55);
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      text-align: center;
      align-self: flex-start;
    }

    /* Retry button */
    #retry-btn {
      display: none;
      pointer-events: auto;
    }

    /* ── PORTRAIT WARNING ── */
    #portrait-warning {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 100;
      background: #111;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 32px;
    }

    #portrait-warning p {
      font-size: 22px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }

    @media (orientation: portrait) {
      #portrait-warning { display: flex; }
    }

    /* ── START OVERLAY ── */
    #start-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: linear-gradient(160deg, #0a0a0a 0%, #1a1a2e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      padding: 32px;
      padding-top: calc(var(--safe-top) + 32px);
      padding-bottom: calc(var(--safe-bottom) + 32px);
    }

    #start-overlay h1 {
      font-size: clamp(32px, 8vw, 60px);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 30px rgba(255,204,0,0.4);
      letter-spacing: -1px;
    }

    #start-overlay .start-sub {
      font-size: clamp(13px, 2.5vw, 17px);
      color: rgba(255,255,255,0.75);
      text-align: center;
      max-width: 460px;
      line-height: 1.5;
    }

    #start-overlay .start-safety {
      font-size: clamp(12px, 2vw, 15px);
      color: #ff9966;
      font-weight: 600;
      text-align: center;
    }

    #start-btn {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 16px;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 800;
      padding: 16px 52px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-shadow: 0 0 30px rgba(255,204,0,0.4);
    }
    #start-btn:active { opacity: 0.8; }

    /* ── GPS ERROR OVERLAY ── */
    #gps-error-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,0,0.88);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px;
      gap: 20px;
      text-align: center;
    }

    #gps-error-msg {
      font-size: clamp(14px, 2.5vw, 18px);
      color: rgba(255,255,255,0.9);
      line-height: 1.6;
      max-width: 500px;
    }

    #retry-gps-btn {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      padding: 12px 36px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #retry-gps-btn:active { opacity: 0.8; }

    /* Leaflet overrides */
    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(0,0,0,0.5) !important;
      color: rgba(255,255,255,0.6) !important;
    }
    .leaflet-control-attribution a { color: rgba(255,255,255,0.6) !important; }
    .leaflet-control-zoom { display: none; }

    /* Accuracy circle */
    .accuracy-circle {
      fill: rgba(100,160,255,0.10);
      stroke: rgba(100,160,255,0.45);
      stroke-width: 1.5;
    }

    /* Position dot */
    .position-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4da6ff;
      border: 3px solid #fff;
      box-shadow: 0 0 8px rgba(77,166,255,0.8);
    }
  </style>
</head>
<body>

  <!-- Map -->
  <div id="map" aria-label="Kartta" role="img"></div>

  <!-- HUD (visible after start) -->
  <div id="hud" aria-hidden="false">
    <div id="top-panel">
      <!-- Speed -->
      <div id="speed-block" aria-label="GPS-nopeus">
        <div id="speed-value" aria-live="polite" aria-atomic="true">0</div>
        <div id="speed-unit">km/h</div>
      </div>

      <!-- Info -->
      <div id="info-panel">
        <div id="time-display" aria-live="polite" aria-atomic="true">--.-​-</div>
        <div id="weather-row" class="info-row" aria-live="polite">Sää ladataan…</div>
        <div id="wind-row" class="info-row"></div>
        <div id="gps-status-row" class="info-row status-moderate" aria-live="polite" aria-atomic="true">Etsitään GPS-signaalia</div>
        <div id="gps-accuracy-row" class="info-row">Tarkkuus: –</div>
        <div id="network-row" class="info-row" aria-live="polite"></div>
      </div>
    </div>

    <div id="controls-row">
      <button class="hud-btn" id="center-btn" aria-label="Keskitä kartta sijaintiin">Keskitä</button>
      <button class="hud-btn" id="retry-btn" aria-label="Yritä GPS-yhteyttä uudelleen">Yritä uudelleen</button>
      <div id="safety-msg" aria-hidden="true">Käytä ajoneuvon omaa mittaristoa ensisijaisena nopeusmittarina.</div>
    </div>
  </div>

  <!-- Portrait warning -->
  <div id="portrait-warning" aria-live="polite" role="alert">
    <p>Käännä puhelin vaakatasoon.</p>
  </div>

  <!-- Start overlay -->
  <div id="start-overlay" role="dialog" aria-modal="true" aria-label="Aloitusnäyttö">
    <h1>Moto Dashboard</h1>
    <p class="start-sub">Paina Aloita ja salli tarkka sijainti. Käynnistä sovellus ennen liikkeelle lähtöä.</p>
    <button id="start-btn" aria-label="Aloita sovellus">Aloita</button>
    <p class="start-safety">Älä käytä kosketusnäyttöä ajon aikana.</p>
  </div>

  <!-- GPS error overlay -->
  <div id="gps-error-overlay" role="alert" aria-live="assertive">
    <div id="gps-error-msg"></div>
    <button id="retry-gps-btn" aria-label="Yritä GPS-yhteyttä uudelleen">Yritä uudelleen</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLs=" crossorigin=""></script>
  <script>
  (function () {
    'use strict';

    // ── Elements ──────────────────────────────────────────────────────────────
    var elSpeedValue    = document.getElementById('speed-value');
    var elTimeDisplay   = document.getElementById('time-display');
    var elWeatherRow    = document.getElementById('weather-row');
    var elWindRow       = document.getElementById('wind-row');
    var elGpsStatus     = document.getElementById('gps-status-row');
    var elGpsAccuracy   = document.getElementById('gps-accuracy-row');
    var elNetworkRow    = document.getElementById('network-row');
    var elStartOverlay  = document.getElementById('start-overlay');
    var elStartBtn      = document.getElementById('start-btn');
    var elHud           = document.getElementById('hud');
    var elCenterBtn     = document.getElementById('center-btn');
    var elRetryBtn      = document.getElementById('retry-btn');
    var elGpsErrOverlay = document.getElementById('gps-error-overlay');
    var elGpsErrMsg     = document.getElementById('gps-error-msg');
    var elRetryGpsBtn   = document.getElementById('retry-gps-btn');

    // ── State ─────────────────────────────────────────────────────────────────
    var map            = null;
    var posMarker      = null;
    var accCircle      = null;
    var watchId        = null;
    var followUser     = true;
    var wakeLock       = null;
    var weatherTimer   = null;
    var lastWeatherFetch = 0;
    var smoothedSpeed  = 0;
    var prevCoords     = null;  // {lat, lon, t}
    var lastGoodCoords = null;  // {lat, lon}
    var started        = false;

    // ── Clock ─────────────────────────────────────────────────────────────────
    function updateClock() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      elTimeDisplay.textContent = h + '.' + m;
    }
    setInterval(updateClock, 500);
    updateClock();

    // ── Network status ────────────────────────────────────────────────────────
    function updateNetwork() {
      if (navigator.onLine) {
        elNetworkRow.textContent = 'Verkko käytössä';
        elNetworkRow.className = 'info-row status-good';
      } else {
        elNetworkRow.textContent = 'Ei verkkoyhteyttä';
        elNetworkRow.className = 'info-row status-bad';
      }
    }
    window.addEventListener('online',  updateNetwork);
    window.addEventListener('offline', updateNetwork);
    updateNetwork();

    // ── Map init ──────────────────────────────────────────────────────────────
    function initMap() {
      if (map || typeof L === 'undefined') return;
      map = L.map('map', {
        zoomControl: false,
        attributionControl: true,
        dragging: true,
        touchZoom: true,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false
      }).setView([60.1699, 24.9384], 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
        maxZoom: 19,
        crossOrigin: true
      }).addTo(map);

      // Detect manual pan → stop following
      map.on('dragstart', function () { followUser = false; });
    }

    // ── Position marker ───────────────────────────────────────────────────────
    var dotIcon = L.divIcon({
      className: '',
      html: '<div class="position-dot"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    function updateMapPosition(lat, lon, accuracy) {
      if (!map) return;
      var latlng = [lat, lon];
      if (!posMarker) {
        posMarker = L.marker(latlng, { icon: dotIcon, interactive: false }).addTo(map);
      } else {
        posMarker.setLatLng(latlng);
      }
      if (!accCircle) {
        accCircle = L.circle(latlng, {
          radius: accuracy,
          className: 'accuracy-circle',
          interactive: false
        }).addTo(map);
      } else {
        accCircle.setLatLng(latlng);
        accCircle.setRadius(accuracy);
      }
      if (followUser) {
        map.setView(latlng, map.getZoom() < 14 ? 16 : map.getZoom());
      }
    }

    // ── Center button ─────────────────────────────────────────────────────────
    elCenterBtn.addEventListener('click', function () {
      followUser = true;
      if (map && lastGoodCoords) {
        map.setView([lastGoodCoords.lat, lastGoodCoords.lon], 16);
      }
    });

    // ── Haversine distance (metres) ───────────────────────────────────────────
    function haversine(lat1, lon1, lat2, lon2) {
      var R = 6371000;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
            + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180)
            * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ── Speed display ─────────────────────────────────────────────────────────
    function setSpeedDisplay(kmh) {
      if (!isFinite(kmh) || isNaN(kmh) || kmh < 0) kmh = 0;
      kmh = Math.round(kmh);
      if (kmh < 2) kmh = 0;
      elSpeedValue.textContent = String(kmh);
    }

    // ── GPS position handler ──────────────────────────────────────────────────
    function onPosition(pos) {
      var c = pos.coords;
      var now = Date.now();
      var lat = c.latitude;
      var lon = c.longitude;
      var accuracy = c.accuracy;

      // Update accuracy display
      elGpsAccuracy.textContent = 'Tarkkuus: ' + Math.round(accuracy) + ' m';

      // GPS status
      if (accuracy <= 20) {
        elGpsStatus.textContent = 'GPS hyvä';
        elGpsStatus.className = 'info-row status-good';
      } else if (accuracy <= 50) {
        elGpsStatus.textContent = 'GPS kohtalainen';
        elGpsStatus.className = 'info-row status-moderate';
      } else {
        elGpsStatus.textContent = 'GPS heikko';
        elGpsStatus.className = 'info-row status-bad';
      }

      // Hide error overlay
      elGpsErrOverlay.style.display = 'none';
      elRetryBtn.style.display = 'none';

      // Speed
      var speedKmh = null;
      if (typeof c.speed === 'number' && isFinite(c.speed) && c.speed >= 0) {
        speedKmh = c.speed * 3.6;
      } else if (accuracy <= 75 && prevCoords) {
        var dt = (now - prevCoords.t) / 1000; // seconds
        if (dt >= 2) {
          var dist = haversine(prevCoords.lat, prevCoords.lon, lat, lon);
          // Sanity: ignore jumps > 500m in 2s (~900 km/h) — use stricter 300 km/h cap
          var rawKmh = (dist / dt) * 3.6;
          if (rawKmh <= 300) {
            speedKmh = rawKmh;
          }
        }
      }

      if (speedKmh !== null && isFinite(speedKmh)) {
        // Exponential smoothing α=0.4 (responsive but not jittery)
        smoothedSpeed = 0.4 * speedKmh + 0.6 * smoothedSpeed;
      }
      // If no speed reading, keep smoothedSpeed (slow decay toward 0)
      else {
        smoothedSpeed = smoothedSpeed * 0.85;
      }

      setSpeedDisplay(smoothedSpeed);

      // Update prev coords only for good accuracy
      if (accuracy <= 75) {
        prevCoords = { lat: lat, lon: lon, t: now };
      }
      lastGoodCoords = { lat: lat, lon: lon };

      // Map
      updateMapPosition(lat, lon, accuracy);

      // Weather (first time + every 15 min)
      if (lastWeatherFetch === 0 || (now - lastWeatherFetch) >= 15 * 60 * 1000) {
        fetchWeather(lat, lon);
      }
    }

    // ── GPS error handler ─────────────────────────────────────────────────────
    function onGpsError(err) {
      elGpsStatus.textContent = 'GPS ei saatavilla';
      elGpsStatus.className = 'info-row status-bad';
      setSpeedDisplay(0);
      smoothedSpeed = 0;
      prevCoords = null;

      var msg;
      if (err.code === 1) {
        // PERMISSION_DENIED
        msg = 'Sijaintilupa tarvitaan nopeuden ja kartan näyttämiseen. Salli sijainti Safarin asetuksista ja lataa sivu uudelleen.';
        elRetryGpsBtn.style.display = 'none';
      } else if (err.code === 3) {
        // TIMEOUT
        msg = 'GPS-signaali aikakatkaistu. Tarkista sijainti ja yritä uudelleen.';
        elRetryGpsBtn.style.display = '';
      } else {
        msg = 'GPS-virhe: ' + (err.message || 'Tuntematon virhe') + '. Yritä uudelleen.';
        elRetryGpsBtn.style.display = '';
      }

      elGpsErrMsg.textContent = msg;
      elGpsErrOverlay.style.display = 'flex';
      elRetryBtn.style.display = '';
    }

    // ── Start GPS ─────────────────────────────────────────────────────────────
    function startGps() {
      if (!('geolocation' in navigator)) {
        elGpsStatus.textContent = 'GPS ei saatavilla';
        elGpsStatus.className = 'info-row status-bad';
        elGpsErrMsg.textContent = 'Selain ei tue GPS-paikannusta.';
        elGpsErrOverlay.style.display = 'flex';
        elRetryGpsBtn.style.display = 'none';
        return;
      }
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }
      watchId = navigator.geolocation.watchPosition(onPosition, onGpsError, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      });
    }

    // ── Wake lock ─────────────────────────────────────────────────────────────
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) { /* silently ignore */ }
    }

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && started) {
        requestWakeLock();
      }
    });

    // ── Fullscreen ────────────────────────────────────────────────────────────
    function tryFullscreen() {
      var el = document.documentElement;
      try {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } catch (e) { /* silently ignore */ }
    }

    // ── Weather ───────────────────────────────────────────────────────────────
    var WMO_CODES = {
      0: 'Selkeää',
      1: 'Melko selkeää', 2: 'Puolipilvistä', 3: 'Pilvistä',
      45: 'Sumua', 48: 'Huurteista sumua',
      51: 'Kevyttä tihkusadetta', 53: 'Tihkusadetta', 55: 'Tiheää tihkusadetta',
      56: 'Jäätävää tihkusadetta', 57: 'Tiheää jäätävää tihkusadetta',
      61: 'Kevyttä sadetta', 63: 'Sadetta', 65: 'Rankkasadetta',
      66: 'Jäätävää sadetta', 67: 'Tiheää jäätävää sadetta',
      71: 'Kevyttä lumisadetta', 73: 'Lumisadetta', 75: 'Tiheää lumisadetta',
      77: 'Lumirakeita',
      80: 'Sadekuuroja', 81: 'Sadekuuroja', 82: 'Voimakkaita sadekuuroja',
      85: 'Lumikuuroja', 86: 'Voimakkaita lumikuuroja',
      95: 'Ukkosta', 96: 'Ukkosta ja raesadetta', 99: 'Ukkosta ja raesadetta'
    };

    function wmoToFinnish(code) {
      return WMO_CODES[code] || 'Sää ei saatavilla';
    }

    function fetchWeather(lat, lon) {
      if (!navigator.onLine) return;
      lastWeatherFetch = Date.now();
      var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lat.toFixed(4)
        + '&longitude=' + lon.toFixed(4)
        + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m'
        + '&temperature_unit=celsius'
        + '&wind_speed_unit=kmh'
        + '&timezone=auto';

      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.current) {
            var cur = data.current;
            var temp = Math.round(cur.temperature_2m);
            var wind = Math.round(cur.wind_speed_10m);
            var desc = wmoToFinnish(cur.weather_code);
            elWeatherRow.textContent = desc + '  ' + temp + ' °C';
            elWindRow.textContent = 'Tuuli ' + wind + ' km/h';
          } else {
            elWeatherRow.textContent = 'Sää ei saatavilla';
            elWindRow.textContent = '';
          }
        })
        .catch(function () {
          elWeatherRow.textContent = 'Sää ei saatavilla';
          elWindRow.textContent = '';
        });
    }

    // ── Start button ──────────────────────────────────────────────────────────
    elStartBtn.addEventListener('click', function () {
      started = true;
      initMap();
      startGps();
      requestWakeLock();
      tryFullscreen();
      // Hide start overlay after GPS init attempt
      elStartOverlay.style.display = 'none';
    });

    // ── Retry buttons ─────────────────────────────────────────────────────────
    function retryGps() {
      elGpsErrOverlay.style.display = 'none';
      elRetryBtn.style.display = 'none';
      elGpsStatus.textContent = 'Etsitään GPS-signaalia';
      elGpsStatus.className = 'info-row status-moderate';
      startGps();
    }
    elRetryGpsBtn.addEventListener('click', retryGps);
    elRetryBtn.addEventListener('click', retryGps);

    // ── Leaflet load fallback ─────────────────────────────────────────────────
    window.addEventListener('load', function () {
      if (typeof L === 'undefined') {
        // Leaflet failed to load — map won't work but rest of app continues
        console.warn('Leaflet ei latautunut. Kartta ei ole käytettävissä.');
      }
    });

  })();
  </script>
</body>
</html>
