name: Deploy MotoDash Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-motodash-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'EggHeadStudio/MotoDashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
        shell: bash
    env:
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js on the GitHub runner
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked Worker dependencies
        run: npm ci

      - name: Check bundle and run local Worker tests
        # npm test builds with --dry-run first; tests use mock Google/Firebase data.
        # No Cloudflare or private Firebase credential is supplied to this step.
        run: npm test

      - name: Verify required deployment secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo '::error::Create the CLOUDFLARE_API_TOKEN repository Actions secret.'
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo '::error::Create the CLOUDFLARE_ACCOUNT_ID repository Actions secret.'
            exit 1
          fi

      - name: Deploy existing motodash-live Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          packageManager: npm
          # Reuse the Wrangler installed by npm ci from cloudflare/package-lock.json.
          command: deploy --config wrangler.jsonc
          quiet: true
        # FIRESTORE_SERVICE_ACCOUNT and MEDIA_SERVICE_ACCOUNT stay in Cloudflare's
        # encrypted Worker secrets. MEDIA_BUCKET must already be a private bucket.
        # No Worker secret upload, frontend deployment or Firebase deploy occurs here.
